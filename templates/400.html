{% extends 'base.html' %}
{% block title %}Solicitud inválida{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <div class="eyebrow">Error 400</div>
    <h2 class="mb-2">Solicitud inválida</h2>
    <p class="text-muted">La solicitud no se pudo procesar. Inténtalo de nuevo.</p>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-primary" onclick="history.back()">Volver</button>
      <a class="btn btn-outline-secondary" href="{% url 'clinica:dashboard' %}">Ir al inicio</a>
    </div>
  </div>
</div>
{% endblock content %}
