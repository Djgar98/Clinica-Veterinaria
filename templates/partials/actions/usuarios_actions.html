{% if perms.auth.add_user %}
  <a href="{% url 'usuarios:create' %}" class="btn btn-primary"><i class="fas fa-user-plus me-1"></i> Nuevo usuario</a>
{% endif %}
{% if perms.auth.change_user %}
  <a href="{% url 'usuarios:bulk_roles' %}" class="btn btn-outline-secondary"><i class="fas fa-users-gear me-1"></i> Roles masivos</a>
{% endif %}
{% if perms.usuarios.view_accesslog %}
  <a href="{% url 'usuarios:access_logs' %}" class="btn btn-outline-secondary"><i class="fas fa-shield-halved me-1"></i> Logs de acceso</a>
{% endif %}
{% if perms.usuarios.view_auditlog %}
  <a href="{% url 'usuarios:audit_logs' %}" class="btn btn-outline-secondary"><i class="fas fa-clipboard-list me-1"></i> Auditoría</a>
{% endif %}
