{% extends 'base.html' %}
{% block title %}No encontrado{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <div class="eyebrow">Error 404</div>
    <h2 class="mb-2">Página no encontrada</h2>
    <p class="text-muted">La página que buscas no existe o fue movida.</p>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-primary" onclick="history.back()">Volver</button>
      <a class="btn btn-outline-secondary" href="{% url 'clinica:dashboard' %}">Ir al inicio</a>
    </div>
  </div>
</div>
{% endblock content %}
