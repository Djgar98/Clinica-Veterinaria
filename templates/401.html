{% extends 'base.html' %}
{% block title %}No autenticado{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <div class="eyebrow">Error 401</div>
    <h2 class="mb-2">Necesitas iniciar sesión</h2>
    <p class="text-muted">Para acceder a esta sección, inicia sesión con tu cuenta.</p>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">Ir a iniciar sesión</a>
      <a class="btn btn-outline-secondary" href="{% url 'clinica:dashboard' %}">Ir al inicio</a>
    </div>
  </div>
</div>
{% endblock content %}
