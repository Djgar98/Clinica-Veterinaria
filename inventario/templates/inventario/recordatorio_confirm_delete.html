{% extends 'base.html' %}
{% block title %}Eliminar recordatorio{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <div class="eyebrow">Inventario</div>
    <h2 class="mb-1">Eliminar recordatorio</h2>
    <p class="text-muted mb-0">Esta acción no se puede deshacer.</p>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form method="post">{% csrf_token %}
      <div class="d-flex gap-2">
        <a href="{% url 'inventario:recordatorio_list' %}" class="btn btn-outline-secondary">Cancelar</a>
        <button class="btn btn-danger" type="submit">Eliminar</button>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
